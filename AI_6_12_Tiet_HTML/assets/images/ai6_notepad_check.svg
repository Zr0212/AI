<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" rx="16" fill="#F1F5F9"/>

  <!-- Notepad Window -->
  <g transform="translate(60, 30)">
    <!-- Window Shadow & Frame -->
    <rect width="680" height="340" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2" filter="drop-shadow(0 6px 14px rgba(0,0,0,0.15))"/>
    
    <!-- Title Bar -->
    <rect width="680" height="38" rx="10" fill="#E2E8F0"/>
    <rect y="25" width="680" height="13" fill="#E2E8F0"/>
    
    <!-- App Icon & Title -->
    <rect x="15" y="10" width="18" height="18" rx="3" fill="#3B82F6"/>
    <text x="24" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">txt</text>
    
    <text x="42" y="24" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#0F172A">
      Cau_hoi_tu_vung.txt - Notepad
    </text>

    <!-- Window buttons -->
    <g transform="translate(615, 10)">
      <rect width="18" height="18" fill="#CBD5E1"/>
      <text x="9" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">−</text>
      <rect x="22" width="18" height="18" fill="#CBD5E1"/>
      <text x="31" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">□</text>
      <rect x="44" width="18" height="18" fill="#EF4444"/>
      <text x="53" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">✕</text>
    </g>

    <!-- Menu Bar -->
    <rect y="38" width="680" height="28" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="56" font-family="Arial, sans-serif" font-size="13" fill="#475569">
      Tệp&nbsp;&nbsp;&nbsp;&nbsp;Chỉnh sửa&nbsp;&nbsp;&nbsp;&nbsp;Định dạng&nbsp;&nbsp;&nbsp;&nbsp;Xem&nbsp;&nbsp;&nbsp;&nbsp;Trợ giúp
    </text>

    <!-- Text area inside Notepad -->
    <rect x="15" y="76" width="650" height="250" fill="#FFFFFF"/>
    
    <!-- Cursor line -->
    <line x1="25" y1="95" x2="25" y2="120" stroke="#2563EB" stroke-width="2"/>
    
    <!-- Clean content -->
    <text x="30" y="112" font-family="'Consolas', 'Courier New', monospace" font-size="18" fill="#0F172A">
      Từ "under" nghĩa là gì trong câu:
    </text>
    <text x="30" y="145" font-family="'Consolas', 'Courier New', monospace" font-size="18" font-weight="bold" fill="#1D4ED8">
      "The cat is under the table"?
    </text>

    <line x1="25" y1="180" x2="655" y2="180" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="6,4"/>

    <!-- Verification notes inside notepad -->
    <text x="30" y="220" font-family="Arial, sans-serif" font-size="14" fill="#059669" font-weight="bold">
      [ĐÃ KIỂM TRA]
    </text>
    <text x="30" y="248" font-family="Arial, sans-serif" font-size="14" fill="#334155">
      ✔ Không chứa họ tên học sinh.
    </text>
    <text x="30" y="272" font-family="Arial, sans-serif" font-size="14" fill="#334155">
      ✔ Không chứa lớp, trường, số điện thoại hay địa chỉ nhà.
    </text>
  </g>

  <!-- 3 Verification Highlights below -->
  <g transform="translate(60, 390)">
    <rect width="680" height="85" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="25" y="30" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#065F46">
      3 BƯỚC KIỂM TRA TỆP ĐÃ TẢI VỀ:
    </text>
    <text x="40" y="58" font-family="Arial, sans-serif" font-size="13" fill="#047857">
      1. Tên tệp sạch: <tspan font-weight="bold">Cau_hoi_tu_vung.txt</tspan> (không ghi tên riêng vào tên tệp)
    </text>
    <text x="380" y="58" font-family="Arial, sans-serif" font-size="13" fill="#047857">
      2. Mở lại tệp đọc kỹ nội dung
    </text>
  </g>
</svg>