<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" rx="16" fill="#F8FAFC"/>
  
  <!-- Header Bar -->
  <rect width="800" height="65" rx="16" fill="#303F83"/>
  <rect y="45" width="800" height="20" fill="#303F83"/>
  <circle cx="45" cy="32" r="18" fill="#3B82F6"/>
  <text x="45" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">AI</text>
  <text x="75" y="30" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">Trợ lý Học tập AI</text>
  <text x="75" y="49" font-family="Arial, sans-serif" font-size="12" fill="#86EFAC">Bước 3: Bản sạch an toàn</text>

  <rect x="580" y="18" width="190" height="28" rx="6" fill="#16A34A"/>
  <text x="675" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">✔ BẢN SẠCH AN TOÀN</text>

  <!-- Chat Area -->
  <g transform="translate(60, 95)">
    <!-- User bubble -->
    <circle cx="650" cy="20" r="18" fill="#3B82F6"/>
    <text x="650" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF">HS</text>
    <text x="620" y="25" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Học sinh lớp 6</text>

    <rect x="130" y="45" width="524" height="70" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
    <text x="150" y="75" font-family="Arial, sans-serif" font-size="15" fill="#166534">
      Cho mình hỏi từ <tspan font-weight="bold" fill="#15803D">"under"</tspan> trong câu tiếng Anh:
    </text>
    <text x="150" y="100" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#047857">
      "The cat is under the table" có nghĩa là gì?
    </text>

    <!-- AI Response bubble -->
    <circle cx="20" cy="165" r="18" fill="#303F83"/>
    <text x="20" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF">AI</text>
    <rect x="50" y="145" width="560" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="75" y="175" font-family="Arial, sans-serif" font-size="15" fill="#1E293B">
      Chào bạn! Trong câu này:
    </text>
    <text x="75" y="202" font-family="Arial, sans-serif" font-size="15" fill="#1E293B">
      • <tspan font-weight="bold" fill="#2563EB">under</tspan> là giới từ chỉ vị trí, nghĩa là <tspan font-weight="bold">"ở dưới"</tspan>.
    </text>
    <text x="75" y="230" font-family="Arial, sans-serif" font-size="15" fill="#475569">
      → Cả câu dịch là: <tspan font-style="italic" fill="#0F172A">"Con mèo ở dưới cái bàn."</tspan>
    </text>
  </g>

  <!-- Green Success Banner -->
  <g transform="translate(60, 385)">
    <rect width="680" height="85" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
    <circle cx="45" cy="42" r="22" fill="#22C55E"/>
    <text x="45" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF">✔</text>
    <text x="85" y="35" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#166534">
      KẾT QUẢ: ĐẠT MỤC TIÊU HỌC TẬP MÀ VẪN GIỮ TRÒN AN TOÀN!
    </text>
    <text x="85" y="60" font-family="Arial, sans-serif" font-size="14" fill="#15803D">
      AI vẫn hiểu và trả lời chính xác mà không cần cung cấp bất kỳ dữ liệu cá nhân nào của em.
    </text>
  </g>
</svg>