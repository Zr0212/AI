<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Big Central Shield -->
  <g transform="translate(400, 220)">
    <!-- Shield Outer glow -->
    <path d="M0 -150 C90 -150 140 -120 140 -30 C140 80 50 135 0 160 C-50 135 -140 80 -140 -30 C-140 -120 -90 -150 0 -150 Z" 
          fill="none" stroke="#60A5FA" stroke-width="10" opacity="0.4" filter="url(#glow)"/>
    <!-- Shield Body -->
    <path d="M0 -140 C80 -140 125 -110 125 -25 C125 70 45 125 0 145 C-45 125 -125 70 -125 -25 C-125 -110 -80 -140 0 -140 Z" 
          fill="url(#shieldGrad)" stroke="#93C5FD" stroke-width="4"/>
    
    <!-- Lock inside Shield -->
    <g transform="translate(0, -10)">
      <!-- Shackle -->
      <path d="M-30 -10 V-40 C-30 -62 30 -62 30 -40 V-10" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
      <!-- Body -->
      <rect x="-42" y="-12" width="84" height="68" rx="14" fill="url(#goldGrad)"/>
      <!-- Keyhole -->
      <circle cx="0" cy="16" r="9" fill="#1E293B"/>
      <path d="M-4 18 L4 18 L6 34 L-6 34 Z" fill="#1E293B"/>
    </g>
  </g>

  <!-- Title & Badges -->
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#F8FAFC" letter-spacing="1.5">
    AN TOÀN &amp; BẢO VỆ QUYỀN RIÊNG TƯ KHI DÙNG AI
  </text>
  
  <!-- Left badge: Dữ liệu cá nhân -->
  <g transform="translate(70, 160)">
    <rect width="180" height="150" rx="12" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="34" rx="12" fill="#334155"/>
    <text x="90" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#38BDF8">DỮ LIỆU CÁ NHÂN</text>
    <text x="15" y="60" font-family="Arial, sans-serif" font-size="13" fill="#E2E8F0">• Họ tên thật</text>
    <text x="15" y="85" font-family="Arial, sans-serif" font-size="13" fill="#E2E8F0">• Trường lớp</text>
    <text x="15" y="110" font-family="Arial, sans-serif" font-size="13" fill="#E2E8F0">• Địa chỉ nhà</text>
    <text x="15" y="135" font-family="Arial, sans-serif" font-size="13" fill="#EF4444" font-weight="bold">🔒 Cần bảo vệ</text>
  </g>

  <!-- Right badge: Quyền riêng tư -->
  <g transform="translate(550, 160)">
    <rect width="180" height="150" rx="12" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="34" rx="12" fill="#334155"/>
    <text x="90" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#4ADE80">QUYỀN RIÊNG TƯ</text>
    <text x="15" y="60" font-family="Arial, sans-serif" font-size="13" fill="#E2E8F0">• Kiểm soát dữ liệu</text>
    <text x="15" y="85" font-family="Arial, sans-serif" font-size="13" fill="#E2E8F0">• Chỉ gửi phần cần</text>
    <text x="15" y="110" font-family="Arial, sans-serif" font-size="13" fill="#E2E8F0">• Từ chối quyền thừa</text>
    <text x="15" y="135" font-family="Arial, sans-serif" font-size="13" fill="#22C55E" font-weight="bold">🛡️ Giữ an toàn</text>
  </g>

  <!-- Bottom slogan -->
  <rect x="180" y="420" width="440" height="44" rx="22" fill="#047857" opacity="0.9"/>
  <text x="400" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#ECFDF5">
    💡 Nguyên tắc: Chỉ cung cấp thông tin cần thiết cho nhiệm vụ
  </text>
</svg>