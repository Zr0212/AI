<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" rx="16" fill="#F8FAFC"/>
  
  <!-- Header Bar -->
  <rect width="800" height="65" rx="16" fill="#303F83"/>
  <rect y="45" width="800" height="20" fill="#303F83"/>
  <circle cx="45" cy="32" r="18" fill="#3B82F6"/>
  <text x="45" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">AI</text>
  <text x="75" y="30" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">Trợ lý Học tập AI</text>
  <text x="75" y="49" font-family="Arial, sans-serif" font-size="12" fill="#93C5FD">Bước 2: Xác định thông tin cần xóa</text>

  <rect x="580" y="18" width="190" height="28" rx="6" fill="#DC2626"/>
  <text x="675" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">TÔ ĐỎ 4 THÔNG TIN</text>

  <!-- Chat Area with Redacted boxes -->
  <g transform="translate(60, 95)">
    <circle cx="650" cy="20" r="18" fill="#64748B"/>
    <text x="650" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF">Minh</text>
    <text x="620" y="25" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Bạn Minh</text>

    <!-- Chat Bubble -->
    <rect x="46" y="45" width="608" height="175" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    
    <!-- Line 1 -->
    <text x="70" y="80" font-family="Arial, sans-serif" font-size="15" fill="#475569">Chào AI, mình là </text>
    <rect x="185" y="62" width="155" height="26" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="192" y="80" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#B91C1C">Nguyễn Văn Minh ✖</text>

    <!-- Line 2 -->
    <text x="70" y="115" font-family="Arial, sans-serif" font-size="15" fill="#475569">học </text>
    <rect x="105" y="97" width="225" height="26" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="112" y="115" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#B91C1C">lớp 6A THCS Lê Lợi ✖</text>

    <!-- Line 3 -->
    <text x="70" y="150" font-family="Arial, sans-serif" font-size="15" fill="#475569">số nhà </text>
    <rect x="125" y="132" width="160" height="26" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="132" y="150" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#B91C1C">12 Hàng Bông ✖</text>
    <text x="295" y="150" font-family="Arial, sans-serif" font-size="15" fill="#475569">, mẹ: </text>
    <rect x="335" y="132" width="140" height="26" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="342" y="150" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#B91C1C">0912 xxx xxx ✖</text>

    <!-- Line 4 - Kept -->
    <rect x="65" y="172" width="350" height="32" rx="6" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
    <text x="75" y="193" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#15803D">
      ✔ Cho mình hỏi từ "under" nghĩa là gì?
    </text>
    <text x="430" y="193" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#16A34A">← CHỈ GIỮ LẠI CÂU NÀY</text>
  </g>

  <!-- Explanation card below -->
  <g transform="translate(60, 345)">
    <rect width="680" height="125" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="25" y="32" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#92400E">
      💡 VÌ SAO PHẢI XÓA 4 THÔNG TIN TÔ ĐỎ?
    </text>
    <text x="40" y="65" font-family="Arial, sans-serif" font-size="14" fill="#78350F">
      • Hỏi nghĩa từ vựng <tspan font-weight="bold">hoàn toàn không cần</tspan> biết tên, lớp, địa chỉ hay SĐT mẹ.
    </text>
    <text x="40" y="95" font-family="Arial, sans-serif" font-size="14" fill="#78350F">
      • Hệ thống AI có thể <tspan font-weight="bold" fill="#DC2626">lưu trữ dữ liệu vào máy chủ</tspan> và có nguy cơ lộ lọt thông tin.
    </text>
  </g>
</svg>