<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#242124"/>
  <title>AI và tương lai nghề nghiệp | Bài giảng lớp 9</title>
  <link rel="stylesheet" href="css/slides.css"/>
</head>
<body class="presentation-page">
  <main id="slideViewport" aria-label="Trình chiếu bài giảng">
    <div id="slideStage" role="region" aria-live="polite"></div>
  </main>
  <nav id="controls" aria-label="Điều khiển trình chiếu">
    <button id="prevBtn" title="Slide trước (←)" aria-label="Slide trước">‹</button>
    <span id="slideCounter" aria-live="polite">01 / 22</span>
    <button id="nextBtn" title="Slide tiếp theo (→)" aria-label="Slide tiếp theo">›</button>
    <span class="control-separator"></span>
    <span id="activityTimer" aria-live="off">05:00</span>
    <button id="timerButton" title="Bắt đầu / tạm dừng đồng hồ">▶</button>
    <button id="resetTimer" title="Đặt lại thời gian">↺</button>
    <span class="control-separator"></span>
    <button id="presenterBtn" title="Mở ghi chú giáo viên">GV</button>
    <button id="fullBtn" title="Toàn màn hình (F)">⛶</button>
  </nav>
  <div id="toaster" role="status" aria-live="polite"></div>
  <script src="js/slides-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
