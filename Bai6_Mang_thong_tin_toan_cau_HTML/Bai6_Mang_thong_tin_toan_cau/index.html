function browserRender(){const cur=browser.url;let title='',text='',links=[];if(cur==='about:home'){title='Trang chủ trình duyệt mô phỏng';text='Nhập vi.wikipedia.org, khituongvietnam.gov.vn hoặc vtvgo.vn trên thanh địa chỉ rồi Enter.';links=[['Wikipedia','https://vi.wikipedia.org'],['Thời tiết','https://khituongvietnam.gov.vn'],['Thời sự','https://vtvgo.vn']]}else if(cur.includes('wikipedia')){title=cur.toLowerCase().includes('hệ_mặt_trời')?'Hệ Mặt Trời':cur.includes('mặt_trời')?'Mặt Trời':'Wikipedia tiếng Việt (mô phỏng)';text='Tên trang · ô tìm kiếm · nội dung · siêu liên kết. Chọn một liên kết, sau đó thử Back.';links=[['Hệ Mặt Trời','https://vi.wikipedia.org/wiki/Hệ_Mặt_Trời'],['Mặt Trời','https://vi.wikipedia.org/wiki/Mặt_Trời']]}else if(cur.includes('khituong')){title='Trang thông tin thời tiết (mô phỏng)';text='Nguồn: khí tượng · Vùng thông tin: địa điểm, tình trạng, thời điểm cập nhật. Không có số liệu trực tiếp.';links=[['Chuyên mục dự báo','https://khituongvietnam.gov.vn/du-bao']]}else if(cur.includes('vtv')){title='Trang tin tức (mô phỏng)';text='Nhận diện nguồn, chương trình, tiêu đề, ngày đăng và ý chính.';links=[['Mục thời sự','https://vtvgo.vn/thoi-su']]}else{title='Địa chỉ chưa có trong mô phỏng';text='Hãy thử một trong ba địa chỉ hướng dẫn. Trang thật chỉ mở khi giáo viên chủ động mở trình duyệt thực tế.'}return `<div class="browser"><div class="browser-bar"><button data-browse="back" ${browser.at===0?'disabled':''} title="Back">←</button><button data-browse="forward" ${browser.at===browser.history.length-1?'disabled':''} title="Forward">→</button><button data-browse="reload" title="Reload">↻</button><button data-browse="home" title="Home">⌂</button><input id="urlInput" value="${esc(cur==='about:home'?'':cur)}" aria-label="Thanh địa chỉ" placeholder="Nhập địa chỉ website rồi nhấn Enter"><button data-browse="enter" title="Truy cập">↵</button><button data-browse="bookmark" title="Lưu dấu trang">${browser.bookmarks.includes(cur)?'★':'☆'}</button></div function matchRender(d){let state=matchState[idx]||{left:null,pairs:{},reveal:false},right=[...d.body.map(x=>x[1])];let order=d.body.length===4?[2,0,3,1]:right.map((x,i)=>i);return `<div class="match-grid"><div class="match-col">${d.body.map(([a,b],i)=>`<button class="match-btn ${state.left===i?'selected':''} ${state.pairs[i]!==undefined?'done':''}" data-match-left="${i}">${i+1}. ${esc(a)} ${state.pairs[i]!==undefined?'✓':''}</button>`).join('')}</div><div class="match-col">${order.map((original,j)=>`<button class="match-btn" data-match-right="${original}">${'abcd'[j]}) ${esc(d.body[original][1])}</button>`).join('')}</div></div><div class="match-result">${Object.entries(state.pairs).map(([a,z])=>`${Number(a)+1}–${'abcd'[order.indexOf(z)]}`).join(' · ')||'Nhấp một ô ở cột trái rồi chọn nội dung tương ứng ở cột phải.'}</div><div class="actions">${btn('Kiểm tra','match-check')}${btn('Hiện đáp án','match-answer','secondary')}${btn('Làm lại','match-reset','secondary')}</div>${state.reveal?`<div class="answer">${d.body.map((x,i)=>`${i+1}–${'abcd'[order.indexOf(i)]}`).join(' · ')}</div>`:''}`}
function render(){const d=S[idx];$('#slide').innerHTML=`<header><div class="kicker">${esc(d.sec)} · ${esc(d.minutes||'TIN HỌC 6')}</div><h1>${esc(d.title)}</h1></header><div id="main">${renderBody(d)}</div><div class="footer"><span>${esc(d.source)}</span><strong>TIẾT ${d.sec.startsWith('T2')?'2':'1'} · ${idx+1}/${S.length}</strong></div>`;$('#count').textContent=`${idx+1}/${S.length}`;$('#prev').disabled=idx===0;$('#next').disabled=idx===S.length-1;$('#returnBtn').hidden=returnIdx===null;$('#draw').classList.toggle('drawing',drawMode);renderDrawing();updatePresenter();if(role==='preview')$('#tools').style.display='none'}function updatePresenter(){if(!document.body.classList.contains('presenter'))return;const d=S[idx];$('#presenterTitle').textContent=`${idx+1}. ${d.title}`;$('#presenterNotes').textContent=d.notes;$('#presenterAnswer').textContent=String(d.hint||d.answer||((d.kind==='match')?d.body.map((x,i)=>`${i+1}: ${x[1]}`).join(' · '):'Gợi ý trả lời xem trong giáo án, hoặc hỏi học sinh giải thích.'));$('#presenterNext').textContent=S[idx+1]?.title||'Kết thúc';$('#presenterTime').textContent=`Thời gian hoạt động: ${d.minutes||'Theo tiến trình giáo án'}`}
function browse(url,fromHistory=false){if(!fromHistory){browser.history=browser.history.slice(0,browser.at+1);browser.history.push(url);browser.at=browser.history.length-1}browser.url=url;render();broadcast()}function onAction(ev){let t=ev.target.closest('button');if(!t)return;const d=S[idx];const q=questions[idx]||(questions[idx]={});if(t.dataset.choice){q.selected=t.dataset.choice;q.revealed=false;q.feedback='';render();broadcast();return}if(t.dataset.jump){go(Number(t.dataset.jump));return}if(t.dataset.webmap!==undefined){q.webmap=Number(t.dataset.webmap);render();broadcast();return}if(t.dataset.weather!==undefined){q.weather=Number(t.dataset.weather);render();broadcast();return}if(t.dataset.news!==undefined){q.news=Number(t.dataset.news);render();broadcast();return}if(t.dataset.matchLeft!==undefined){let z=matchState[idx]||(matchState[idx]={left:null,pairs:{},reveal:false});z.left=Number(t.dataset.matchLeft);render();return}if(t.dataset.matchRight!==undefined){let z=matchState[idx]||(matchState[idx]={left:null,pairs:{},reveal:false});if(z.left!==null){let val=Number(t.dataset.matchRight);for(let key of Object.keys(z.pairs))if(z.pairs[key]===val)delete z.pairs[key];z.pairs[z.left]=val;z.left=null;render();broadcast()}return}if(t.dataset.url){browse(t.dataset.url);return}if(t.dataset.browse){let a=t.dataset.browse;if(a==='back'&&browser.at>0){browser.at--;browse(browser.history[browser.at],true)}if(a==='forward'&&browser.at<browser.history.length-1){browser.at++;browse(browser.history[browser.at],true)}if(a==='home')browse('about:home');if(a==='reload'){render();broadcast()}if(a==='enter'){let u=$('#urlInput').value.trim();browse(u.startsWith('http')?u:'https://'+u)}if(a==='bookmark'){let u=browser.url;if(u!=='about:home'){browser.bookmarks=browser.bookmarks.includes(u)?browser.bookmarks.filter(x=>x!==u):[...browser.bookmarks,u];render();broadcast()}}return}let a=t.dataset.act;if(!a)return;if(a==='answer'){q.revealed=!q.revealed;q.feedback='';render();broadcast()}if(a==='check'){q.revealed=true;q.feedback=q.selected?`Em chọn ${q.selected}. ${q.selected===d.answer?'Chính xác!':'Hãy đối chiếu đáp án đúng.'} Đáp án: ${d.answer}.`:'Hãy chọn phương án trước khi kiểm tra.';render();broadcast()}if(a==='reset'){questions[idx]={};render();broadcast()}if(a==='match-check'){let z=matchState[idx]||(matchState[idx]={left:null,pairs:{},reveal:false});z.reveal=true;z.feedback=d.body.every((x,i)=>z.pairs[i]===i);render();broadcast()}if(a==='match-answer'){let z=matchState[idx]||(matchState[idx]={left:null,pairs:{},reveal:false});z.reveal=!z.reveal;render();broadcast()}if(a==='match-reset'){matchState[idx]={left:null,pairs:{},reveal:false};render();broadcast()}if(a==='close-news'){delete q.news;render();broadcast()}}$('#slide').addEventListener('click',onAction);$('#slide').addEventListener('input',e=>{if(e.target.matches('[data-open-answer]')){(questions[idx]||(questions[idx]={})).text=e.target.value;broadcast()}});$('#slide').addEventListener('keydown',e=>{if(e.target.id==='urlInput'&&e.key==='Enter'){e.preventDefault();browse(e.target.value.startsWith('http')?e.target.value:'https://'+e.target.value)}});
function drawPoint(e){const r=$('#draw').getBoundingClientRect();return {x:(e.clientX-r.left)*1280/r.width,y:(e.clientY-r.top)*720/r.height}}function renderDrawing(){const c=$('#draw'),ctx=c.getContext('2d');ctx.clearRect(0,0,1280,720);ctx.strokeStyle='#e75d22';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';for(const line of strokes[idx]||[]){if(!line.length)continue;ctx.beginPath();ctx.moveTo(line[0].x,line[0].y);for(const p of line.slice(1))ctx.lineTo(p.x,p.y);ctx.stroke()}}$('#draw').addEventListener('pointerdown',e=>{if(!drawMode)return;drawing=true;currentStroke=[drawPoint(e)];($('#draw').setPointerCapture)(e.pointerId)});$('#draw').addEventListener('pointermove',e=>{if(!drawing||!drawMode)return;currentStroke.push(drawPoint(e));let arr=strokes[idx]||(strokes[idx]=[]);if(!arr.includes(currentStroke))arr.push(currentStroke);renderDrawing()});$('#draw').addEventListener('pointerup',e=>{if(!drawing)return;drawing=false;let arr=strokes[idx]||(strokes[idx]=[]);if(!arr.includes(currentStroke))arr.push(currentStroke);currentStroke=null;renderDrawing();broadcast()});$('#drawBtn').onclick=()=>{drawMode=!drawMode;$('#drawBtn').textContent=drawMode?'✓ Xong bút':'✏ Bút';$('#draw').classList.toggle('drawing',drawMode)};$('#undoBtn').onclick=()=>{(strokes[idx]||[]).pop();renderDrawing();broadcast()};$('#clearBtn').onclick=()=>{strokes[idx]=[];renderDrawing();broadcast()};
$('#prev').onclick=()=>go(idx-1);$('#next').onclick=()=>go(idx+1);$('#menuBtn').onclick=()=>$('#menu').classList.add('show');$('#closeMenu').onclick=()=>$('#menu').classList.remove('show');$('#startT1').onclick=()=>{go(0);$('#menu').classList.remove('show')};const T2=S.findIndex(x=>x.sec.startsWith('T2'));$('#startT2').onclick=()=>{go(T2);$('#menu').classList.remove('show')};$('#menuItems').innerHTML=S.map((d,i)=>`<button data-menu="${i}"><small>${i+1}. ${esc(d.sec)}</small><br>${esc(d.title)}</button>`).join('');$('#menuItems').onclick=e=>{let b=e.target.closest('[data-menu]');if(b){go(Number(b.dataset.menu));$('#menu').classList.remove('show')}};function notebook(){if(returnIdx===null)returnIdx=idx;let target=S.findIndex((x,i)=>i>= (idx>=T2?T2:0) && x.sec.startsWith(idx>=T2?'T2 · GHI VỞ':'T1 · GHI VỞ'));go(target)}$('#notesJump').onclick=notebook;$('#returnBtn').onclick=()=>{if(returnIdx!==null){let v=returnIdx;returnIdx=null;go(v)}};$('#fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};function clockView(){let x=clockSecs;$('#clock').textContent=`${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`}$('#clockBtn').onclick=()=>{clockRunning=!clockRunning;$('#clockBtn').textContent=clockRunning?'Ⅱ':'▶';if(clockTick)clearInterval(clockTick);if(clockRunning)clockTick=setInterval(()=>{clockSecs++;clockView()},1000)};$('#resetBtn').onclick=()=>{if(!confirm('Bắt đầu tiết mới? Xóa tất cả lựa chọn, nét viết và dấu trang mô phỏng?'))return;questions={};matchState={};strokes={};browser={url:'about:home',history:['about:home'],at:0,bookmarks:[]};clockSecs=0;clockRunning=false;clearInterval(clockTick);clockView();go(idx)};clockView();document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea')||document.body.classList.contains('presenter'))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(idx+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(idx-1);if(e.key==='Home')go(0);if(e.key==='End')go(S.length-1);if(e.key==='Escape')$('#menu').classList.remove('show')});
let child=null;function openPresenter(){if(role==='preview')return;let url=new URL(location.href);url.searchParams.set('role','preview');child=window.open(url.toString(),'bai6_audience','width=1280,height=800');if(!child){alert('Trình duyệt chặn cửa sổ mới. Hãy cho phép pop-up rồi bấm lại.');return}document.body.classList.add('presenter');$('#preview').src=url.toString();updatePresenter();broadcast();alert('Đã mở cửa sổ học sinh. Hãy dùng Windows + P → Extend và kéo cửa sổ học sinh sang máy chiếu. Góc giáo viên ở cửa sổ hiện tại.')};$('#presentBtn').onclick=openPresenter;$('#pPrev').onclick=()=>go(idx-1);$('#pNext').onclick=()=>go(idx+1);$('#pClose').onclick=()=>document.body.classList.remove('presenter');$('#pNote').onclick=notebook;$('#pMenu').onclick=()=>{$('#menu').classList.add('show')};if(channel)channel.onmessage=e=>{if(e.data?.kind==='state'&&e.data.data){applying=true;const s=e.data.data;idx=s.idx;questions=s.questions||{};matchState=s.matchState||{};browser=s.browser||browser;strokes=s.strokes||{};clockSecs=s.clockSecs||0;render();clockView();applying=false}};addEventListener('storage',e=>{if(e.key==='bai6_student_state'&&e.newValue){try{const s=JSON.parse(e.newValue);idx=s.idx;questions=s.questions||{};matchState=s.matchState||{};browser=s.browser||browser;strokes=s.strokes||{};render()}catch(err){}}});if(role==='preview'){$('#tools').style.display='none';document.body.style.background='black';}render();})();
</script></body></html>
